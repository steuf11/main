# Steuf Master Dashboard — Nginx reverse proxy
# Install: sudo cp steuf.conf /etc/nginx/sites-available/steuf
#          sudo ln -s /etc/nginx/sites-available/steuf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # Replace with VPS_IP or domain

    # Landing page
    location / {
        root /var/www/steuf-master;
        index index.html;
    }

    # Crypto Intel Dashboard (port 3000)
    location /crypto/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # SSE support
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Pokemon Arbitrage Dashboard (port 3001)
    location /pokemon/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Pokemon API (port 8000)
    location /pokemon/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pokemon WebSocket
    location /pokemon/ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
